version: '3.9'

services:
  app:
    build: .
    container_name: hms-app
    ports:
      - "8080:8080"
    environment:
      APP_PROFILE: dev
      DB_URL: jdbc:postgresql://postgres:5432/hospital_db
      DB_USERNAME: hospital_user
      DB_PASSWORD: hospital_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBobXMgaG9zcGl0YWwgbWFuYWdlbWVudCBzeXN0ZW0=}
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:4200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hms-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_user -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hms-network

volumes:
  postgres_data:
  redis_data:

networks:
  hms-network:
    driver: bridge
