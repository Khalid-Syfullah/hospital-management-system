services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/hospital_db
      DB_USERNAME: hospital
      DB_PASSWORD: hospital
      REDIS_HOST: redis
      JWT_SECRET: QWJjZGVmR2hpamtsTW5vcFFyc3R1dnd4eXoxMjM0NTY3ODkwMTIzNDU2Nzg5
    ports:
      - "8080:8080"

volumes:
  postgres-data:
