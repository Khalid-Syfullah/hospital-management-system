spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  cache:
    type: none

jwt:
  secret: test-secret-key-for-jwt-token-signing-minimum-32-characters-long
  access-token-expiration: 900000
  refresh-token-expiration: 86400000
  issuer: test-issuer

logging:
  level:
    com.hospital: DEBUG